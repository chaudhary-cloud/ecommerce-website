{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        My Store
    </title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<header>

    <nav>

        <!-- LOGO -->

        <a href="{% url 'home' %}">
            My Store
        </a>


        <!-- NAV LINKS -->

        <a href="{% url 'home' %}">
            Home
        </a>


        <a href="{% url 'home' %}#products">
            Products
        </a>


        <!-- CART -->

        <a href="{% url 'cart' %}">
            Cart

            {% if cart_count > 0 %}
                <sup>{{ cart_count }}</sup>
            {% endif %}

        </a>


        <!-- ORDERS -->

        <a href="{% url 'orders' %}">
            Orders
        </a>


        <!-- LOGOUT -->

        <a href="{% url 'logout' %}">
            Logout
        </a>

    </nav>

</header>


<!-- =========================
     MESSAGES
========================= -->

{% if messages %}

    {% for message in messages %}

        <div class="message {{ message.tags }}">
            {{ message }}
        </div>

    {% endfor %}

{% endif %}


<!-- =========================
     MAIN CONTENT
========================= -->

<main>

    {% block content %}

    {% endblock %}

</main>


<!-- =========================
     FOOTER
========================= -->

<footer>

    <p>
        © 2026 My Store. All Rights Reserved.
    </p>

</footer>


<script src="{% static 'js/script.js' %}"></script>

</body>

</html>
